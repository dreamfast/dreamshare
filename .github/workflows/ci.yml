name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # same pinned versions as the Makefile, so local and ci agree
      - run: make tools

      # lint and unit tests only. the e2e suites stay local, the runner
      # has no browser binaries and the human eye beats a screenshot diff
      - run: make ci-checks
